/* canzano tokens: the semantic layer. Needs palette.css first.
   Pages use these names, never a raw palette step, so both themes and a rebrand stay one edit.
   Fonts load from Google Fonts (see template.html). Light is the default. On screen, dark follows
   the system or data-theme="dark". Paper is always light, unless <html> also has class keep-theme.
   The three dark blocks below must stay identical; tests/check.py verifies it. */

:root {
  /* Neutrals */
  --page: var(--grey-0);
  --raised: var(--grey-50);
  --panel: var(--grey-100);              /* panels, code, segmented tracks */
  --ink: oklch(0.293 0.011 293);         /* primary text, the primary button */
  --ink-2: var(--grey-600);              /* body copy, labels */
  --ink-3: var(--grey-500);              /* meta, captions, disabled */
  --rule: var(--grey-150);               /* row dividers */
  --rule-strong: var(--grey-300);        /* section rules */

  /* Accent: the one live thing. Never a button fill. Point it at another hue to rebrand. */
  --accent: var(--violet-300);

  /* Status: a real state only, always next to a word. */
  --positive: var(--green-700);
  --warning: var(--amber-700);
  --negative: var(--red-300);
  --info: var(--blue-400);

  /* Soft: a tint of the same colour for a selected row, a diff line or a highlight.
     Never a callout box or a chip. Works in both themes. */
  --accent-soft: color-mix(in oklab, var(--accent) 12%, var(--page));
  --positive-soft: color-mix(in oklab, var(--positive) 12%, var(--page));
  --warning-soft: color-mix(in oklab, var(--warning) 14%, var(--page));
  --negative-soft: color-mix(in oklab, var(--negative) 12%, var(--page));
  --info-soft: color-mix(in oklab, var(--info) 12%, var(--page));

  /* Series: categorical chart colours, used in this order. Neighbours differ in hue and
     in lightness, so they hold up for colour-blind readers. Series 1 is the accent. */
  --series-1: var(--violet-300);
  --series-2: var(--orange-400);
  --series-3: var(--pink-400);
  --series-4: var(--sky-500);
  --series-5: var(--green-500);
  --series-6: var(--yellow-500);
  --series-7: var(--purple-300);
  --series-8: var(--red-300);

  /* Controls: a fill that is a touch lighter at the top and bottom edge, inside a crisp 1px edge. */
  --btn-top: oklch(0.975 0 0);
  --btn-mid: oklch(0.95 0 0);
  --btn-edge: var(--grey-200);
  --btn-fg: var(--ink);
  --btn1-top: oklch(0.42 0.011 293);     /* primary: ink on light, white on dark. Never the accent. */
  --btn1-mid: oklch(0.293 0.011 293);
  --btn1-edge: oklch(0.22 0.011 293);
  --btn1-fg: oklch(1 0 0);
  --btn-hover: brightness(0.97);
  --thumb: oklch(1 0 0);                 /* selected segment */
  --thumb-edge: transparent;
  --thumb-shadow: 0 1px 2px oklch(0.25 0.02 278 / 0.18), 0 0 0 0.5px oklch(0.25 0.02 278 / 0.12);

  /* Type */
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --text-label: 11px;   /* mono caps, +0.04em */
  --text-small: 13px;
  --text-body: 15px;    /* Inter, 1.6 line height */
  --text-lead: 16px;
  --text-title: 22px;   /* mono */
  --text-figure: 28px;  /* mono, tabular */
  --tracking-caps: 0.04em;
  --measure: 68ch;

  /* Space: 4px base */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 40px; --s7: 80px;
  --gutter: 24px;

  /* Geometry and motion */
  --r-control: 6px;      /* buttons, inputs, segments */
  --r-panel: 12px;       /* panels */
  --radius-media: 2px;
  --hairline: 1px;
  --control-h: 27px;     /* one height for every control in a row; hit area is expanded separately */
  --control-px: 8px;
  --hit: 44px;
  --fast: 120ms;

  color-scheme: light;
}

@media screen and (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: var(--grey-950);
    --raised: oklch(0.19 0.003 286);

    --ink: oklch(0.964 0 0);

    --series-5: var(--green-200);

    --btn-hover: brightness(1.1);
    --thumb: oklch(0.964 0 0 / 0.12);
    --thumb-edge: oklch(0.964 0 0 / 0.14);
    --thumb-shadow: none;
    color-scheme: dark;
  }
}

@media print {
  :root[data-theme="dark"].keep-theme {
    --page: var(--grey-950);
    --raised: oklch(0.19 0.003 286);
    --panel: var(--grey-900);
    --ink: oklch(0.964 0 0);
    --ink-2: oklch(0.964 0 0 / 0.7);
    --ink-3: oklch(0.964 0 0 / 0.5);
    --rule: oklch(0.964 0 0 / 0.1);
    --rule-strong: oklch(0.964 0 0 / 0.2);

    --accent: var(--violet-100);
    --positive: var(--green-200);
    --warning: var(--amber-200);
    --negative: var(--red-100);
    --info: var(--blue-100);

    --series-1: var(--violet-100);
    --series-2: var(--orange-200);
    --series-3: var(--pink-200);
    --series-4: var(--sky-200);
    --series-5: var(--green-200);
    --series-6: var(--yellow-200);
    --series-7: var(--purple-100);
    --series-8: var(--red-100);

    --btn-top: oklch(0.3 0 0);
    --btn-mid: oklch(0.255 0 0);
    --btn-edge: oklch(0.34 0 0);
    --btn1-top: oklch(1 0 0);
    --btn1-mid: oklch(0.93 0 0);
    --btn1-edge: oklch(0.8 0 0);
    --btn1-fg: oklch(0.15 0 0);
    --btn-hover: brightness(1.1);
    --thumb: oklch(0.964 0 0 / 0.12);

/* canzano base. Load after palette.css and tokens.css.

   The rules live in cascade layers. A later layer beats an earlier one whatever the selectors say,
   so a helper class always wins over a component, and a component over an element default:

     base        element defaults: type, links, tables, wrapping
     controls    buttons, inputs, selects, checks
     components  strips, ledgers, panels, rows, forms, menus, figures
     ui          the interface layer (ui.css)
     viz         charts and generated diagrams (kits/charts/viz.css)
     print       paper
     deck        slides (kits/decks/deck.css)
     helpers     width, colour and layout helpers

   Styles a page writes for itself sit outside the layers and beat all of them. Do not raise a
   selector's specificity to win a fight here: put the rule in the right layer. */

@layer base, controls, components, ui, viz, print, deck, helpers;

@layer base {
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; font-synthesis: none; }   /* never fake a bold or an italic the page did not load */
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 400 var(--text-body)/1.6 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1120px; margin: 0 auto; padding: var(--s6) var(--gutter) var(--s7); }

  /* Type: mono carries structure, the reading face carries prose. */
  h1, h2, h3, .label, th, figcaption, .meta, nav, .figure { font-family: var(--mono); font-weight: 400; }
  h1 { font-size: var(--text-title); line-height: 1.35; letter-spacing: -0.01em; margin: 0 0 var(--s3); }
  h2, .label, th {
    font-size: var(--text-label); line-height: 1.6; letter-spacing: var(--tracking-caps);
    text-transform: uppercase; color: var(--ink-2); margin: 0;
  }
  h3 { font-size: var(--text-small); line-height: 1.5; margin: 0 0 6px; }
  p { margin: 0 0 var(--s3); color: var(--ink-2); }
  p.lead { color: var(--ink); font-size: var(--text-lead); }
  .meta, figcaption { font-size: var(--text-label); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-3); }
  figcaption { margin-top: 10px; }
  strong, b { font-weight: 600; color: var(--ink); }
  /* The mono face is loaded upright at 400 and 500: emphasis inside it is 500 and full ink, never italic. */
  :is(h1, h2, h3, .label, th, .meta, figcaption, code, pre, kbd, .figure, td.num) :is(strong, b) { font-weight: 500; }
  :is(h1, h2, h3, .label, th, .meta, figcaption, code, pre, kbd, .figure, td.num) :is(em, i) { font-style: normal; color: var(--ink); }
  code, pre, kbd { font: var(--text-small)/1.6 var(--mono); }
  pre { margin: 0 0 var(--s4); padding: var(--s3) var(--s4); background: var(--panel); border-radius: var(--r-control); overflow-x: auto; }
  a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule-strong); transition: border-color var(--fast); }
  a:hover { border-color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Wrapping: headings and short display lines balance, so no line ends in one stranded word.
     Running text avoids a short last line. A number keeps its unit through &nbsp; in the markup. */
  h1, h2, h3, .lead, .meta, figcaption, th, .label, blockquote { text-wrap: balance; }
  p, li, td, dd { text-wrap: pretty; }
  p, li { orphans: 2; widows: 2; }
  h1, h2, h3 { break-after: avoid; }

  /* Section: a hairline and a mono caps label. */
  section { border-top: 1px solid var(--rule-strong); padding-top: 14px; margin-top: var(--s6); }
  section > h2:first-child { margin-bottom: 20px; }

  table { width: 100%; border-collapse: collapse; margin: 0 0 var(--s4); }
  th { text-align: left; white-space: nowrap; padding: 0 var(--s4) 10px 0; border-bottom: 1px solid var(--rule-strong); }
  td { padding: 11px var(--s4) 11px 0; border-bottom: 1px solid var(--rule); vertical-align: baseline; }
  td.num, th.num { text-align: right; font-family: var(--mono); }

  figure { margin: var(--s5) 0; }
  figure img, figure svg, figure video { display: block; width: 100%; height: auto; }

  @media (max-width: 640px) {
    :root { --gutter: 16px; }
    main { padding-top: 28px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
}

@layer controls {
  /* One recipe for every control, so any mix in a row lines up: the same height (--control-h), radius,
     1px edge and 14/21 text. Buttons and selects carry the subtle fill; inputs sit on the page colour. */
  button, .button, select,
  input:not([type="checkbox"], [type="radio"], [type="range"], [type="file"]), textarea {
    box-sizing: border-box; height: var(--control-h); margin: 0; padding: 0 var(--control-px);
    font: 400 14px/21px var(--sans); letter-spacing: 0.02em;
    border: 1px solid var(--btn-edge); border-radius: var(--r-control);
  }
  .sm :is(button, .button, select, input, textarea), :is(button, .button, select, input).sm { font-size: 13px; }

  button, .button, select {
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    white-space: nowrap; text-decoration: none; cursor: pointer; color: var(--btn-fg);
    background: linear-gradient(var(--btn-top) 0%, var(--btn-mid) 37%, var(--btn-mid) 61%, color-mix(in oklab, var(--btn-top) 55%, var(--btn-mid)) 100%);
    transition: filter var(--fast), transform var(--fast), color var(--fast);
  }
  button::after, .button::after {            /* the hit area: wider than the painted box, never visible */
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: var(--hit); transform: translateY(-50%);
  }
  button:hover, .button:hover, select:hover { filter: var(--btn-hover); }
  button:active, .button:active { transform: scale(0.97); }
  button.primary, .button.primary {
    color: var(--btn1-fg); border-color: var(--btn1-edge);
    background: linear-gradient(var(--btn1-top) 0%, var(--btn1-mid) 37%, var(--btn1-mid) 61%, color-mix(in oklab, var(--btn1-top) 55%, var(--btn1-mid)) 100%);
  }
  button.quiet, .button.quiet { background: none; border-color: transparent; color: var(--ink-2); }
  button.quiet:hover, .button.quiet:hover { color: var(--ink); filter: none; }
  button.danger, .button.danger { color: var(--negative); }
  button:disabled, select:disabled { color: var(--ink-3); cursor: default; filter: none; transform: none; opacity: 0.6; }
  button[aria-busy="true"] { color: transparent; cursor: progress; }
  button[aria-busy="true"]::before {
    content: ""; position: absolute; inset: 0; margin: auto; width: 10px; height: 10px;
    border: 1.5px solid var(--ink-3); border-top-color: transparent; border-radius: 50%; animation: cz-spin 0.7s linear infinite;
  }
  button.primary[aria-busy="true"]::before { border-color: var(--btn1-fg); border-top-color: transparent; }
  @keyframes cz-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { button[aria-busy="true"]::before { animation-duration: 2s; } }

  /* Select: a button with a chevron drawn from two gradients, so it follows the theme. */
  select {
    appearance: none; -webkit-appearance: none; justify-content: flex-start; padding-right: 24px;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%),
      linear-gradient(var(--btn-top) 0%, var(--btn-mid) 37%, var(--btn-mid) 61%, color-mix(in oklab, var(--btn-top) 55%, var(--btn-mid)) 100%);
    background-size: 4px 4px, 4px 4px, 100% 100%;
    background-position: right 12px top 50%, right 8px top 50%, 0 0; background-repeat: no-repeat;
  }

  input:not([type="checkbox"], [type="radio"], [type="range"], [type="file"]), textarea {
    width: 100%; min-width: 0; color: var(--ink); background: var(--page); transition: border-color var(--fast);
  }
  textarea { height: auto; min-height: calc(var(--control-h) * 3); padding: 5px var(--control-px); resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--ink-3); }
  input:hover, textarea:hover { border-color: var(--rule-strong); }
  :is(input, select, textarea):focus-visible { outline-offset: 1px; }
  :is(input, select, textarea)[aria-invalid="true"] { border-color: var(--negative); }
  label { display: block; font: var(--text-label)/1.6 var(--mono); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }

  /* Checkbox, radio, switch: 16px, the same edge, ink when on. */
  input[type="checkbox"], input[type="radio"] {
    appearance: none; -webkit-appearance: none; flex: none; width: 16px; height: 16px; margin: 0; cursor: pointer;
    background: var(--page); border: 1px solid var(--rule-strong); border-radius: 4px; transition: background-color var(--fast), border-color var(--fast);
  }
  input[type="radio"] { border-radius: 50%; }
  input[type="checkbox"]:checked, input[type="radio"]:checked { background: var(--ink); border-color: var(--ink); box-shadow: inset 0 0 0 3px var(--page); }
  input[type="checkbox"].switch { width: 28px; border-radius: 8px; background: var(--panel) radial-gradient(circle at 8px 50%, var(--ink-3) 0 5px, transparent 5.5px); box-shadow: none; }
  input[type="checkbox"].switch:checked { background: var(--ink) radial-gradient(circle at 19px 50%, var(--page) 0 5px, transparent 5.5px); box-shadow: none; }
  .check { display: inline-flex; align-items: center; gap: var(--s2); margin: 0; min-height: var(--control-h); font: 400 14px/21px var(--sans); letter-spacing: 0.02em; text-transform: none; color: var(--ink); cursor: pointer; }

  /* Phones zoom the page on input text under 16px, so every control steps up together and a row stays even. */
  @media (max-width: 640px) {
    button, .button, select, .check, textarea,
    input:not([type="checkbox"], [type="radio"], [type="range"], [type="file"]),
    .sm :is(button, .button, select, input, textarea), :is(button, .button, select, input).sm { font-size: 16px; }
  }
}

@layer components {
  /* Metric strip: columns between two rules. */
  .metrics {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule); margin: var(--s5) 0;
  }
  .metrics + section { border-top: 0; margin-top: var(--s4); padding-top: 0; }
  .metrics > div { padding: var(--s4) var(--s4) var(--s4) 0; min-width: 0; }
  .figure { display: block; font-size: var(--text-figure); line-height: 1.2; margin-top: 10px; color: var(--ink); }
  .metrics .label, .metrics .meta, .panel .label { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* one line each, so figures share a baseline */

  /* Ledger: label left, value right, hairline rows. */
  .ledger { list-style: none; margin: 0; padding: 0; }
  .ledger li { display: flex; justify-content: space-between; gap: var(--s5); align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--rule); }
  .ledger li > :last-child { font-family: var(--mono); text-align: right; }
  .ledger li > :last-child :is(strong, b) { font-weight: 500; }
  .ledger li > :last-child :is(em, i) { font-style: normal; color: var(--ink); }

  /* Settings row: a ledger row with the label and one line of detail left, one control right. It stays a row on a phone. */
  .ledger.settings li { align-items: center; }
  .ledger.settings li > :last-child { flex: none; font-family: var(--sans); }
  .ledger.settings small { display: block; font: 400 13px/18px var(--sans); color: var(--ink-3); }

  /* Selected row in a table or ledger: full ink and a mark in a narrow first cell, while the other rows dim. */
  td.mark { width: 20px; padding-right: 0; font-family: var(--mono); color: transparent; }
  tbody:has(tr[aria-selected]) td, ul:has(> li[aria-selected]) > li { color: var(--ink-2); }
  tbody:has(tr[aria-selected]) td.mark { color: transparent; }
  tbody:has(tr[aria-selected]) tr[aria-selected="true"] td, ul:has(> li[aria-selected]) > li[aria-selected="true"] { color: var(--ink); }

  /* Columns: items divided by a top rule, not boxed. */
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--s5); }
  .cols > * { border-top: 1px solid var(--rule); padding-top: var(--s3); min-width: 0; }

  /* A table or a diagram wider than its container scrolls sideways. A hairline on its right edge shows
     while more lies beyond it. Inside a panel the cue is off (its cover would show on the panel fill). */
  .table-wrap, figure.diagram {
    overflow-x: auto;
    background: linear-gradient(var(--page), var(--page)) right / 1px 100% no-repeat local, linear-gradient(var(--ink-3), var(--ink-3)) right / 1px 100% no-repeat scroll;
  }
  .panel .table-wrap, .panel figure.diagram { background: none; }
  /* A diagram keeps the size it was drawn at, so its labels stay readable. Give a hand-drawn svg a
     width attribute equal to its viewBox width. */
  figure.diagram svg { width: auto; max-width: none; }

  /* Hand-drawn diagram: add class "dg" to the svg. One stroke, mono caps labels, colour through the tokens.
     .s a stroke, .s.a the accented path, .at accent text, .mid and .dim the quieter inks, .pkt a moving mark. */
  svg.dg text { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; fill: var(--ink); }
  svg.dg .s { stroke: var(--ink); stroke-width: 1; fill: none; }
  svg.dg .s.a { stroke: var(--accent); }
  svg.dg .at { fill: var(--accent); }
  svg.dg .mid { fill: var(--ink-2); }
  svg.dg .dim { fill: var(--ink-3); }
  svg.dg .pkt { fill: var(--accent); }

  /* Panel: a flat fill with a 12px radius. No edge, no shadow. */
  .panel { background: var(--panel); border-radius: var(--r-panel); padding: var(--s4); min-width: 0; }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s2); }
  .panel .figure { font-size: 22px; margin-top: 6px; }

  /* Wide action: a full-width panel row, label left, arrow right. */
  .wide {
    display: flex; justify-content: space-between; align-items: center; padding: var(--s2) var(--s3);
    background: var(--panel); border: 0; border-radius: var(--r-control); color: var(--ink-2);
    font: 400 14px/21px var(--sans); letter-spacing: 0.02em; transition: color var(--fast);
  }
  .wide::after { content: "→"; color: var(--ink-3); }
  .wide:hover { color: var(--ink); }

  /* Segmented control: a panel track the same height as a button; the selected segment is a raised thumb. It does not slide. */
  .segmented { box-sizing: border-box; display: inline-flex; gap: 2px; height: var(--control-h); padding: 2px; background: var(--panel); border-radius: var(--r-control); }
  .segmented button {
    height: 100%; padding: 0 calc(var(--control-px) - 1px); background: none; border-color: transparent; color: var(--ink-2);
    border-radius: calc(var(--r-control) - 2px); transition: color var(--fast);
  }
  .segmented button:hover { filter: none; color: var(--ink); }
  .segmented button:active { transform: none; }
  .segmented button[aria-pressed="true"] { color: var(--ink); background: var(--thumb); border-color: var(--thumb-edge); box-shadow: var(--thumb-shadow); }

  /* Row: controls side by side. They share one height; inputs take a sensible width, not the rest. */
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
  .row > :is(input, select, .affix) { width: auto; flex: 0 1 200px; }

  /* Joined: controls that act as one (search and its button, a stepper). One shared edge, outer corners only. */
  .joined { display: inline-flex; }
  .joined > * { border-radius: 0; margin-left: -1px; }
  .joined > :first-child { margin-left: 0; border-radius: var(--r-control) 0 0 var(--r-control); }
  .joined > :last-child { border-radius: 0 var(--r-control) var(--r-control) 0; }
  .joined > :only-child { border-radius: var(--r-control); }
  .joined > :is(:focus-visible, :hover) { z-index: 1; }
  .joined > input { width: auto; flex: 1 1 160px; }
  .joined.stepper > button { width: var(--control-h); padding: 0; flex: none; }   /* equal squares either side of the number */
  .joined.stepper > input { width: 48px; flex: 0 0 48px; text-align: center; }

  /* Affix: an input with a unit or prefix inside the same box. */
  .affix {
    box-sizing: border-box; display: inline-flex; align-items: center; width: 100%; height: var(--control-h); margin: 0;
    background: var(--page); border: 1px solid var(--btn-edge); border-radius: var(--r-control);
  }
  .affix:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
  .affix > input { border: 0; background: none; height: 100%; min-width: 0; outline: 0; }
  .affix > span { padding: 0 var(--control-px); font: 12px/1 var(--mono); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
  .affix > span:first-child { padding-right: 0; }

  /* Form: label above, control, then one line of hint or error. Actions close the form. */
  .form { display: grid; gap: var(--s4); max-width: 440px; }
  .field { display: grid; gap: 6px; min-width: 0; justify-items: start; }
  .field > :is(input, select, textarea, .affix, .joined) { justify-self: stretch; }
  .field > label { margin: 0; }
  .field > .hint, .field > .error { font: 400 13px/18px var(--sans); color: var(--ink-3); }
  .field > .error { color: var(--negative); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
  .actions.end { justify-content: flex-end; }

  /* Stack: radios or checks one under another, each with room for a line of explanation. */
  .stack { display: grid; gap: var(--s2); }
  .stack .check { align-items: flex-start; }
  .stack .check small { display: block; font: 400 13px/18px var(--sans); color: var(--ink-3); letter-spacing: 0; }

  /* Menu: the one floating surface, and the one shadow in the system. */
  .menu { position: absolute; z-index: 10; min-width: 180px; padding: var(--s1); background: var(--raised); border: 1px solid var(--rule-strong); border-radius: var(--r-control); box-shadow: 0 8px 24px oklch(0.2 0.02 278 / 0.16); }
  .menu > :is(a, button) { display: flex; align-items: center; justify-content: flex-start; width: 100%; height: var(--control-h); padding: 0 var(--control-px); background: none; border: 0; border-radius: calc(var(--r-control) - 2px); font: 400 14px/21px var(--sans); letter-spacing: 0.02em; text-decoration: none; color: var(--ink); }
  .menu > :is(a, button):hover, .menu > [aria-current] { background: var(--panel); filter: none; }
  .menu > .danger { color: var(--negative); }

  /* ASCII (kits/ascii). A system mono face, because it must have the box and block glyphs at one width;
     a tight line height keeps vertical strokes joined. */
  pre.ascii { margin: 0 0 var(--s4); padding: 0; background: none; border-radius: 0; overflow-x: auto; color: var(--ink);
    font: 13px/1.15 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; letter-spacing: 0; }
  pre.ascii.hero { font-size: clamp(3px, 1.15vw, 16px); line-height: 1; overflow-x: visible; }   /* scales with the page so a banner is never cut */

  @media (max-width: 640px) {
    .ledger:not(.settings) li { flex-direction: column; gap: var(--s1); }
    .ledger:not(.settings) li > :last-child { text-align: left; }
    .ledger.settings li { gap: var(--s4); }
    .table-wrap > table { min-width: 560px; }   /* a wide table scrolls sideways; it does not wrap to a word per line */
  }
}

@layer print {
  @media print {
    body { font-size: 10.5pt; }
    main { max-width: none; padding: 0; }
    tr, li, figure, .metrics { break-inside: avoid; }
    .table-wrap, figure.diagram { overflow: visible; background: none; }
    figure.diagram svg { max-width: 100% !important; height: auto; }   /* a wide diagram shrinks to the page; it cannot scroll on paper */
    .table-wrap > table { min-width: 0; }
    a { border: 0; }
    button, nav, .no-print { display: none; }
  }
}

@layer helpers {
  /* Control size, set once on a parent: .sm for dense tables and toolbars, .lg for the main actions on a phone. */
  .lg { --control-h: 34px; --control-px: 12px; }
  .sm { --control-h: 23px; --control-px: 6px; }

  /* Widths for a control whose content has a known length. */
  .w-xs { width: 64px; flex: 0 0 64px; }
  .w-s { width: 120px; flex: 0 0 120px; }
  .w-m { width: 200px; max-width: 100%; flex: 0 1 200px; }
  .w-l { width: 320px; max-width: 100%; flex: 0 1 320px; }
  .grow { flex: 1 1 200px; }
  .push { margin-left: auto; }
  .read { max-width: var(--measure); }

  /* Colour: one job each. */
  .accent { color: var(--accent); }
  .positive { color: var(--positive); }
  .warning { color: var(--warning); }
  .negative { color: var(--negative); }
  .info { color: var(--info); }
}

/* Paper: A4, 20mm margins, mono page numbers. The running header text is set per document in
   template.html, because it has to be a literal string. Print is light unless <html> has class
   keep-theme (see tokens.css). */
@page {
  size: A4; margin: 20mm;
  @bottom-right { content: counter(page) " / " counter(pages); font: 8pt "Geist Mono", monospace; color: oklch(0.557 0.008 286); }
}

@page { @top-left { content: "SETTINGS"; font: 8pt "Geist Mono", monospace; letter-spacing: 0.04em; color: oklch(0.557 0.008 286); } }
/* canzano UI layer. Load after base.css, for interfaces only. It is the `ui` layer.
   Structure measured from sfcompute.com (frame, small controls, flat panels), not its brand.
   Inter leads the interface. Geist Mono stays on labels, tags and figures. */

@layer ui {
  body { font: 400 15px/22px var(--sans); }
  h1 { font: 500 26px/32px var(--sans); letter-spacing: -0.01em; margin: 0; }
  h2 { font: 600 20px/26px var(--sans); letter-spacing: -0.01em; text-transform: none; color: var(--ink); margin: 0; }
  h3 { font: 500 15px/22px var(--sans); margin: 0; }
  p { letter-spacing: 0.02em; }
  section { border-top: 0; padding-top: 0; margin-top: var(--s5); }

  /* Frame: a sticky aside for navigation, one bordered main column. */
  .shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); max-width: 1248px; margin: 0 auto; min-height: 100vh; }
  .shell > aside { position: sticky; top: 0; align-self: start; height: 100vh; display: flex; flex-direction: column; gap: var(--s5); padding: var(--s5) var(--s4) var(--s4) var(--gutter); }
  .shell > main { max-width: none; margin: 0; padding: var(--s5) 32px var(--s7); border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); }
  .nav { display: flex; flex-direction: column; }
  .nav a { border: 0; padding: 3px 0; font: 400 14px/21px var(--sans); letter-spacing: 0.02em; color: var(--ink-3); transition: color var(--fast); }
  .nav a:hover, .nav a[aria-current] { color: var(--ink); }
  .head { display: flex; justify-content: space-between; align-items: center; gap: var(--s4); margin-bottom: var(--s5); }

  /* Phone: the main actions sit in a .lg action bar above a bottom tab bar. */
  .actionbar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--s2); padding: var(--s4) var(--gutter); --control-h: 34px; --control-px: 12px; }
  .tabbar { position: sticky; bottom: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--page); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar a { position: relative; border: 0; text-align: center; font: 500 12px/1 var(--sans); letter-spacing: 0.02em; color: var(--ink-3); padding: 16px 0; }
  .tabbar a[aria-current] { color: var(--ink); }

  @media (max-width: 800px) {
    .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .shell > aside { position: static; height: auto; flex-direction: row; align-items: center; justify-content: space-between; padding: var(--s3) var(--gutter); border-bottom: 1px solid var(--rule); }
    .shell > aside .nav { flex-direction: row; gap: var(--s4); }
    .shell > aside .foot { display: none; }
    .shell > main { padding: var(--s4) var(--gutter) var(--s6); border: 0; }
  }
}




.brand { font: var(--text-label)/1.6 var(--mono); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink); }
.shell > main > section { margin-top: var(--s6); max-width: 640px; }
.shell > main > section > .label { display: block; margin-bottom: var(--s3); }
.saved { font: var(--text-label)/1 var(--mono); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--positive); }

</style>
</head>
<body>
<div class="shell">
  <aside>
    <span class="brand">Acme // Deploys</span>
    <nav class="nav"><a href="#">Deploys</a><a href="#">Services</a><a href="#">Logs</a><a href="#" aria-current="page">Settings</a></nav>
  </aside>
  <main>
    <div class="head"><h1>Settings</h1></div>

    <section style="margin-top:0">
      <span class="label">Team</span>
      <div class="row">
        <div class="segmented" role="group" aria-label="Members"><button aria-pressed="true">Members</button><button aria-pressed="false">Invited</button></div>
        <input type="search" class="w-m" placeholder="Name or email" aria-label="Find a member">
        <select class="w-s" aria-label="Role"><option>All roles</option><option>Admin</option><option>Member</option></select>
        <button class="push">Invite</button>
      </div>
    </section>

    <section>
      <span class="label">Invite</span>
      <form class="form" onsubmit="return false">
        <div class="pair">
          <div class="field"><label for="n1">First name</label><input id="n1" autocomplete="given-name" value="Lena"></div>
          <div class="field"><label for="n2">Last name</label><input id="n2" autocomplete="family-name" value="Brandt"></div>
        </div>
        <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email" value="lena@" aria-invalid="true" aria-describedby="em-e"><span class="error" id="em-e">Enter a full email address.</span></div>
        <div class="field"><label for="ro">Role</label><select id="ro" class="w-m"><option>Member</option><option>Admin</option></select></div>
        <div class="field"><label for="se">Seats</label>
          <div class="row">
            <div class="joined stepper"><button type="button" aria-label="Fewer seats">-</button><input id="se" class="w-xs" inputmode="numeric" value="12"><button type="button" aria-label="More seats">+</button></div>
            <label class="affix w-s"><span>$</span><input value="240" aria-label="Monthly cost" readonly><span>/ mo</span></label>
          </div>
        </div>
        <div class="actions"><button class="primary">Send invite</button><button type="button">Cancel</button></div>
      </form>
    </section>

    <section>
      <span class="label">Notifications</span>
      <ul class="ledger settings">
        <li><span>Failed deploys<small>Email the author and the on-call engineer</small></span><span><input type="checkbox" class="switch" checked aria-label="Failed deploys"></span></li>
        <li><span>Weekly summary<small>Mondays at 09:00</small></span><span><input type="checkbox" class="switch" aria-label="Weekly summary"></span></li>
        <li><span>Channel</span><span><select class="w-m" aria-label="Channel"><option>#deploys</option><option>#engineering</option></select></span></li>
      </ul>
    </section>

    <section>
      <span class="label">Danger</span>
      <ul class="ledger settings">
        <li><span>Delete this workspace<small>Removes 14 services and their logs</small></span><span><button class="danger">Delete workspace</button></span></li>
      </ul>
    </section>
  </main>
</div>
<script>/* canzano lint. Finds the layout faults that are easy to miss. Load it on any page, run cz.lint() in
   the console or from a script, and fix what it lists. It returns an array of { issue, text }:

     stranded           a heading or line whose last line is one short word
     long-headline      a slide headline over two lines (four on a statement slide)
     overflow           content cut off by its slide, or a page wider than the window
     label-overlap      two labels in a drawing collide
     label-struck       a wire runs through a label
     label-covers-mark  a label sits on another point's marker
     tiny-labels        a drawing shown so small its labels fall under 9.5px
     small-graphic      a drawing under 30% of the room it has on a slide

   An empty array means none of these were found, not that the page is right: still look at it. */
(function () {
  function lint(scope) {
    const out = [], lines = n => { const r = document.createRange(); r.selectNodeContents(n); const rows = []; [...r.getClientRects()].forEach(q => { if (q.width < 1) return; const row = rows.find(x => Math.abs(x.top - q.top) < q.height / 2); if (row) { row.left = Math.min(row.left, q.left); row.right = Math.max(row.right, q.right); } else rows.push({ top: q.top, left: q.left, right: q.right }); }); return rows.sort((a, b) => a.top - b.top); };
    (scope || document).querySelectorAll('h1, h2, h3, p, li, figcaption, .lead').forEach(n => {
      if (!n.offsetParent || n.closest('svg') || /flex|grid/.test(getComputedStyle(n).display)) return;   // a row of parts is laid out, not wrapped
      const rows = lines(n), txt = n.textContent.trim().replace(/\s+/g, ' '); if (rows.length < 2) return;
      const widest = Math.max(...rows.map(r => r.right - r.left)), last = rows[rows.length - 1], lastWord = txt.split(' ').pop();
      if ((last.right - last.left) < widest * 0.2 || (rows.length <= 3 && /^H[123]$/.test(n.tagName) && (last.right - last.left) < widest * 0.34 && lastWord.length < 9)) out.push({ issue: 'stranded', text: txt.slice(0, 80) });
      if (n.closest('.slide') && /^H[12]$/.test(n.tagName) && rows.length > (n.closest('.statement') ? 4 : 2)) out.push({ issue: 'long-headline', text: txt.slice(0, 80) });
    });
    (scope || document).querySelectorAll('.slide').forEach((sl, i) => { if (sl.scrollHeight > sl.clientHeight + 2 || sl.scrollWidth > sl.clientWidth + 2) out.push({ issue: 'overflow', text: 'slide ' + (i + 1) }); });
    (scope || document).querySelectorAll('svg.cz').forEach(svg => {
      const T = [...svg.querySelectorAll('text')].filter(t => t.textContent.trim() && !t.getAttribute('transform')).map(t => ({ t, b: t.getBBox() }));
      const hit = (a, b) => Math.max(0, Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.height, b.y + b.height) - Math.max(a.y, b.y));
      T.forEach((a, i) => T.slice(i + 1).forEach(b => { if (hit(a.b, b.b) > 0.15 * Math.min(a.b.width * a.b.height, b.b.width * b.b.height)) out.push({ issue: 'label-overlap', text: a.t.textContent + ' / ' + b.t.textContent }); }));
      const vb = svg.viewBox.baseVal, shown = vb && vb.width ? svg.clientWidth / vb.width : 1, size = T.length ? parseFloat(getComputedStyle(T[0].t).fontSize) * shown : 99;
      if (size < 9.5) out.push({ issue: 'tiny-labels', text: 'labels render at ' + size.toFixed(1) + 'px; split the drawing or give it more room' });
      svg.querySelectorAll('rect.mark').forEach(mk => { const b = mk.getBBox(), cx = b.x + b.width / 2, cy = b.y + b.height / 2, x = T.find(o => cx > o.b.x && cx < o.b.x + o.b.width && cy > o.b.y && cy < o.b.y + o.b.height); if (x) out.push({ issue: 'label-covers-mark', text: x.t.textContent }); });
      svg.querySelectorAll('path.ln').forEach(p => {
        const len = p.getTotalLength(); if (!len) return;
        for (let d = 0; d <= len; d += 3) { const q = p.getPointAtLength(d), x = T.find(o => !o.struck && q.x > o.b.x + 2 && q.x < o.b.x + o.b.width - 2 && q.y > o.b.y + 3 && q.y < o.b.y + o.b.height - 3); if (x) { x.struck = 1; out.push({ issue: 'label-struck', text: x.t.textContent }); } }
      });
    });
    (scope || document).querySelectorAll('.slide .body svg').forEach(svg => {
      const body = svg.closest('.body'); if (svg.closest('p, td, li, .metrics')) return;
      const cell = svg.closest('.split') ? [...body.children].find(ch => ch.contains(svg)) || body : body;   // on a split slide the room is the column
      const r = svg.getBoundingClientRect(), bb = cell.getBoundingClientRect();
      if (r.width * r.height < 0.3 * bb.width * bb.height) out.push({ issue: 'small-graphic', text: 'fills ' + Math.round(100 * r.width * r.height / (bb.width * bb.height)) + '% of its slide body' });
    });
    if (document.documentElement.scrollWidth > document.documentElement.clientWidth + 2 && !document.querySelector('.deck')) out.push({ issue: 'overflow', text: 'page is wider than the window' });
    return out;
  }
  window.cz = Object.assign(window.cz || {}, { lint });
})();
</script>
