/* canzano tokens: the semantic layer. Needs palette.css first.
   Pages use these names, never a raw palette step, so both themes and a rebrand stay one edit.
   Fonts load from Google Fonts (see template.html). Light is the default; dark follows the
   system or data-theme="dark". */

:root {
  /* Neutrals */
  --page: var(--grey-0);
  --raised: var(--grey-50);
  --panel: var(--grey-100);              /* panels, code, segmented tracks */
  --ink: oklch(0.293 0.011 293);         /* primary text, the primary button */
  --ink-2: var(--grey-600);              /* body copy, labels */
  --ink-3: var(--grey-500);              /* meta, captions, disabled */
  --rule: var(--grey-150);               /* row dividers */
  --rule-strong: var(--grey-300);        /* section rules */

  /* Accent: the one live thing. Never a button fill. Point it at another hue to rebrand. */
  --accent: var(--violet-300);

  /* Status: a real state only, always next to a word. */
  --positive: var(--green-700);
  --warning: var(--amber-700);
  --negative: var(--red-300);
  --info: var(--blue-400);

  /* Soft: a tint of the same colour for a selected row, a diff line or a highlight.
     Never a callout box or a chip. Works in both themes. */
  --accent-soft: color-mix(in oklab, var(--accent) 12%, var(--page));
  --positive-soft: color-mix(in oklab, var(--positive) 12%, var(--page));
  --warning-soft: color-mix(in oklab, var(--warning) 14%, var(--page));
  --negative-soft: color-mix(in oklab, var(--negative) 12%, var(--page));
  --info-soft: color-mix(in oklab, var(--info) 12%, var(--page));

  /* Series: categorical chart colours, used in this order. Neighbours differ in hue and
     in lightness, so they hold up for colour-blind readers. Series 1 is the accent. */
  --series-1: var(--violet-300);
  --series-2: var(--orange-400);
  --series-3: var(--pink-400);
  --series-4: var(--sky-500);
  --series-5: var(--green-500);
  --series-6: var(--yellow-500);
  --series-7: var(--purple-300);
  --series-8: var(--red-300);

  /* Controls: a fill that is a touch lighter at the top and bottom edge, inside a crisp 1px edge. */
  --btn-top: oklch(0.975 0 0);
  --btn-mid: oklch(0.95 0 0);
  --btn-edge: var(--grey-200);
  --btn-fg: var(--ink);
  --btn1-top: oklch(0.42 0.011 293);     /* primary: ink on light, white on dark. Never the accent. */
  --btn1-mid: oklch(0.293 0.011 293);
  --btn1-edge: oklch(0.22 0.011 293);
  --btn1-fg: oklch(1 0 0);
  --btn-hover: brightness(0.97);
  --thumb: oklch(1 0 0);                 /* selected segment */
  --thumb-edge: transparent;
  --thumb-shadow: 0 1px 2px oklch(0.25 0.02 278 / 0.18), 0 0 0 0.5px oklch(0.25 0.02 278 / 0.12);

  /* Type */
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --text-label: 11px;   /* mono caps, +0.04em */
  --text-small: 13px;
  --text-body: 15px;    /* Inter, 1.6 line height */
  --text-lead: 16px;
  --text-title: 22px;   /* mono */
  --text-figure: 28px;  /* mono, tabular */
  --tracking-caps: 0.04em;
  --measure: 68ch;

  /* Space: 4px base */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 40px; --s7: 80px;
  --gutter: 24px;

  /* Geometry and motion */
  --r-control: 6px;      /* buttons, inputs, segments */
  --r-panel: 12px;       /* panels */
  --radius-media: 2px;
  --hairline: 1px;
  --control-h: 27px;     /* one height for every control in a row; hit area is expanded separately */
  --control-px: 8px;
  --hit: 44px;
  --fast: 120ms;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: var(--grey-950);
    --raised: oklch(0.19 0.003 286);
    --panel: var(--grey-900);
    --ink: oklch(0.964 0 0);
    --ink-2: oklch(0.964 0 0 / 0.7);
    --ink-3: oklch(0.964 0 0 / 0.5);
    --rule: oklch(0.964 0 0 / 0.1);
    --rule-strong: oklch(0.964 0 0 / 0.2);

    --accent: var(--violet-100);
    --positive: var(--green-200);
    --warning: var(--amber-200);
    --negative: var(--red-100);
    --info: var(--blue-100);

    --series-1: var(--violet-100);
    --series-2: var(--orange-200);
    --series-3: var(--pink-200);
    --series-4: var(--sky-200);
    --series-5: var(--green-200);
    --series-6: var(--yellow-200);
    --series-7: var(--purple-100);
    --series-8: var(--red-100);

    --btn-top: oklch(0.3 0 0);
    --btn-mid: oklch(0.255 0 0);
    --btn-edge: oklch(0.34 0 0);
    --btn1-top: oklch(1 0 0);
    --btn1-mid: oklch(0.93 0 0);
    --btn1-edge: oklch(0.8 0 0);
    --btn1-fg: oklch(0.15 0 0);
    --btn-hover: brightness(1.1);
    --thumb: oklch(0.964 0 0 / 0.12);
    --thumb-edge: oklch(0.964 0 0 / 0.14);
    --thumb-shadow: none;
    color-scheme: dark;
  }
}

  --btn-top: oklch(0.3 0 0);
  --btn-mid: oklch(0.255 0 0);

/* canzano base. Needs palette.css and tokens.css first. Mono carries structure, Inter carries prose and controls. */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 400 var(--text-body)/1.6 var(--sans);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 1120px; margin: 0 auto; padding: var(--s6) var(--gutter) var(--s7); }
.read { max-width: var(--measure); }

h1, h2, h3, .label, th, figcaption, .meta, nav, .figure { font-family: var(--mono); font-weight: 400; }
h1 { font-size: var(--text-title); line-height: 1.35; letter-spacing: -0.01em; margin: 0 0 var(--s3); }
h2, .label, th {
  font-size: var(--text-label); line-height: 1.6; letter-spacing: var(--tracking-caps);
  text-transform: uppercase; color: var(--ink-2); margin: 0;
}
h3 { font-size: var(--text-small); line-height: 1.5; margin: 0 0 6px; }
p { margin: 0 0 var(--s3); color: var(--ink-2); }
p.lead { color: var(--ink); font-size: var(--text-lead); }
.meta { font-size: var(--text-label); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-3); }
strong { font-weight: 600; color: var(--ink); }
code, pre, kbd { font: var(--text-small)/1.6 var(--mono); }
pre { margin: 0 0 var(--s4); padding: var(--s3) var(--s4); background: var(--panel); border-radius: 8px; overflow-x: auto; }
a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule-strong); transition: border-color var(--fast); }
a:hover { border-color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Wrapping. Headings and short display lines balance, so no line ends in one stranded word.
   Running text avoids a short last line. Units stay with their number through &nbsp; in the markup. */
h1, h2, h3, .lead, .meta, figcaption, th, .label, blockquote { text-wrap: balance; }
p, li, td, dd { text-wrap: pretty; }
p, li { orphans: 2; widows: 2; }
h1, h2, h3 { break-after: avoid; }

/* Section: a hairline and a mono caps label. */
section { border-top: 1px solid var(--rule-strong); padding-top: 14px; margin-top: var(--s6); }
section > h2:first-child { margin-bottom: 20px; }

/* Metric strip: columns between two rules, never tiles. */
.metrics {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule); margin: var(--s5) 0;
}
.metrics + section { border-top: 0; margin-top: var(--s4); padding-top: 0; }
.metrics > div { padding: var(--s4) var(--s4) var(--s4) 0; min-width: 0; }
.figure { display: block; font-size: var(--text-figure); line-height: 1.2; margin-top: 10px; color: var(--ink); }

/* Ledger: label left, value right, hairline rows. */
.ledger { list-style: none; margin: 0; padding: 0; }
.ledger li {
  display: flex; justify-content: space-between; gap: var(--s5); align-items: baseline;
  padding: 11px 0; border-bottom: 1px solid var(--rule);
}
.ledger li > :last-child { font-family: var(--mono); text-align: right; }

table { width: 100%; border-collapse: collapse; margin: 0 0 var(--s4); }
th { text-align: left; white-space: nowrap; padding: 0 var(--s4) 10px 0; border-bottom: 1px solid var(--rule-strong); }
td { padding: 11px var(--s4) 11px 0; border-bottom: 1px solid var(--rule); vertical-align: baseline; }
td.num, th.num { text-align: right; font-family: var(--mono); }
.table-wrap { overflow-x: auto; }

/* Columns: items divided by a top rule, not boxed. */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--s5); }
.cols > * { border-top: 1px solid var(--rule); padding-top: var(--s3); min-width: 0; }

figure { margin: var(--s5) 0; }
figure img, figure svg, figure video { display: block; width: 100%; height: auto; }
/* ASCII from scripts/ascii.py. A system mono face, because it must have the box and block glyphs
   at one width; a tight line height keeps vertical strokes joined. */
pre.ascii { margin: 0 0 var(--s4); padding: 0; background: none; border-radius: 0; overflow-x: auto; color: var(--ink);
  font: 13px/1.15 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; letter-spacing: 0; }
pre.ascii.hero { font-size: clamp(8px, 1.6vw, 16px); line-height: 1; }
pre.ascii .accent { color: var(--accent); }

/* Charts and diagrams drawn by viz.js. --viz-text sets their label size (13px on slides). */
figure.chart { margin: var(--s5) 0; }
svg.cz { display: block; width: 100%; height: auto; overflow: visible; }
svg.cz text { font-family: var(--mono); font-size: var(--viz-text, 11px); letter-spacing: 0.04em; fill: var(--ink-2); }
svg.cz .ink { fill: var(--ink); }
svg.cz .dim { fill: var(--ink-3); }
svg.cz .at { fill: var(--accent); }
svg.cz .onfill { fill: var(--page); }
svg.cz .ln { stroke: var(--ink); stroke-width: 1; fill: none; }
svg.cz .ln.a { stroke: var(--accent); }
svg.cz .dash { stroke-dasharray: 3 3; }
svg.cz .halo { paint-order: stroke; stroke: var(--page); stroke-width: 5px; stroke-linejoin: round; }
svg.cz .grid { stroke: var(--rule); fill: none; }
svg.cz .grid.strong, svg.cz .axis { stroke: var(--rule-strong); fill: none; }

/* Diagrams keep their drawn size so 11px labels stay 11px; narrow screens scroll. */
figure.diagram { overflow-x: auto; }
figure.diagram svg { width: 720px; max-width: none; }
figcaption { font-size: var(--text-label); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-3); margin-top: 10px; }

/* Controls. One recipe for every control, so any mix in a row lines up:
   the same height (--control-h), radius, 1px edge and 14/21 text. Buttons and selects carry the
   subtle fill; inputs sit on the page colour. Set a size once on a parent with .lg or .sm. */
.lg { --control-h: 34px; --control-px: 12px; }
.sm { --control-h: 23px; --control-px: 6px; }

button, .button, select,
input:not([type="checkbox"], [type="radio"], [type="range"], [type="file"]), textarea {
  box-sizing: border-box; height: var(--control-h); margin: 0; padding: 0 var(--control-px);
  font: 400 14px/21px var(--sans); letter-spacing: 0.02em;
  border: 1px solid var(--btn-edge); border-radius: var(--r-control);
}
.sm :is(button, .button, select, input, textarea), :is(button, .button, select, input).sm { font-size: 13px; }

button, .button, select {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  white-space: nowrap; text-decoration: none; cursor: pointer; color: var(--btn-fg);
  background: linear-gradient(var(--btn-top) 0%, var(--btn-mid) 37%, var(--btn-mid) 61%, color-mix(in oklab, var(--btn-top) 55%, var(--btn-mid)) 100%);
  transition: filter var(--fast), transform var(--fast), color var(--fast);
}
button::after, .button::after {
  content: ""; position: absolute; left: 0; right: 0; top: 50%;
  height: var(--hit); transform: translateY(-50%);
}
button:hover, .button:hover, select:hover { filter: var(--btn-hover); }
button:active, .button:active { transform: scale(0.97); }
button.primary, .button.primary {
  color: var(--btn1-fg); border-color: var(--btn1-edge);
  background: linear-gradient(var(--btn1-top) 0%, var(--btn1-mid) 37%, var(--btn1-mid) 61%, color-mix(in oklab, var(--btn1-top) 55%, var(--btn1-mid)) 100%);
}
button.quiet, .button.quiet { background: none; border-color: transparent; color: var(--ink-2); }
button.quiet:hover, .button.quiet:hover { color: var(--ink); filter: none; }
button.danger, .button.danger { color: var(--negative); }
button:disabled, select:disabled { color: var(--ink-3); cursor: default; filter: none; transform: none; opacity: 0.6; }
button[aria-busy="true"] { color: transparent; cursor: progress; }
button[aria-busy="true"]::before {
  content: ""; position: absolute; inset: 0; margin: auto; width: 10px; height: 10px;
  border: 1.5px solid var(--ink-3); border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite;
}
button.primary[aria-busy="true"]::before { border-color: var(--btn1-fg); border-top-color: transparent; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Select: a button with a chevron drawn from two gradients, so it follows the theme. */
select {
  appearance: none; -webkit-appearance: none; justify-content: flex-start; padding-right: 24px;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%),
    linear-gradient(var(--btn-top) 0%, var(--btn-mid) 37%, var(--btn-mid) 61%, color-mix(in oklab, var(--btn-top) 55%, var(--btn-mid)) 100%);
  background-size: 4px 4px, 4px 4px, 100% 100%;
  background-position: right 12px top 50%, right 8px top 50%, 0 0; background-repeat: no-repeat;
}

input:not([type="checkbox"], [type="radio"], [type="range"], [type="file"]), textarea {
  width: 100%; min-width: 0; color: var(--ink); background: var(--page); transition: border-color var(--fast);
}
textarea { height: auto; min-height: calc(var(--control-h) * 3); padding: 5px var(--control-px); resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
input:hover, textarea:hover { border-color: var(--rule-strong); }
:is(input, select, textarea):focus-visible { outline-offset: 1px; }
:is(input, select, textarea)[aria-invalid="true"] { border-color: var(--negative); }
label { display: block; font: var(--text-label)/1.6 var(--mono); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }

/* Segmented control: a panel track the same height as a button; the selected segment is a raised
   thumb. It does not slide. */
.segmented { box-sizing: border-box; display: inline-flex; gap: 2px; height: var(--control-h); padding: 2px; background: var(--panel); border-radius: var(--r-control); }
.segmented button {
  height: 100%; padding: 0 calc(var(--control-px) - 1px); background: none; border-color: transparent; color: var(--ink-2);
  border-radius: calc(var(--r-control) - 2px); transition: color var(--fast);
}
.segmented button:hover { filter: none; color: var(--ink); }
.segmented button:active { transform: none; }
.segmented button[aria-pressed="true"] { color: var(--ink); background: var(--thumb); border-color: var(--thumb-edge); box-shadow: var(--thumb-shadow); }

/* Row: controls side by side. They share one height; inputs take a sensible width, not the rest. */
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
.row > :is(input, select, .affix) { width: auto; flex: 0 1 200px; }
.row > .grow { flex: 1 1 200px; }
.w-xs, .row > .w-xs { width: 64px; flex: 0 0 64px; }
.w-s, .row > .w-s { width: 120px; flex: 0 0 120px; }
.w-m, .row > .w-m { width: 200px; flex: 0 1 200px; }
.w-l, .row > .w-l { width: 320px; flex: 0 1 320px; }
.joined > .w-xs { flex: 0 0 48px; text-align: center; }
.row > .push { margin-left: auto; }

/* Joined: controls that act as one (search and its button, a stepper). One shared edge. */
.joined { display: inline-flex; }
/* :is() lifts these above the base control rule, which would otherwise keep every corner round. */
.joined > :is(button, .button, input, select, .affix, *) { border-radius: 0; margin-left: -1px; }
.joined > :is(button, .button, input, select, .affix, *):first-child { margin-left: 0; border-radius: var(--r-control) 0 0 var(--r-control); }
.joined > :is(button, .button, input, select, .affix, *):last-child { border-radius: 0 var(--r-control) var(--r-control) 0; }
.joined > :is(button, .button, input, select, .affix, *):only-child { border-radius: var(--r-control); }
.joined > :is(:focus-visible, :hover) { z-index: 1; }
.joined > input { width: auto; flex: 1 1 160px; }

/* Affix: an input with a unit or prefix inside the same box. */
.affix {
  box-sizing: border-box; display: inline-flex; align-items: center; width: 100%; height: var(--control-h); margin: 0;
  background: var(--page); border: 1px solid var(--btn-edge); border-radius: var(--r-control);
}
.affix:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.affix > input { border: 0; background: none; height: 100%; min-width: 0; outline: 0; }
.affix > span { padding: 0 var(--control-px); font: 12px/1 var(--mono); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.affix > span:first-child { padding-right: 0; }

/* Checkbox, radio, switch: 16px, the same edge, ink when on. */
input[type="checkbox"], input[type="radio"] {
  appearance: none; -webkit-appearance: none; flex: none; width: 16px; height: 16px; margin: 0; cursor: pointer;
  background: var(--page); border: 1px solid var(--rule-strong); border-radius: 4px; transition: background-color var(--fast), border-color var(--fast);
}
input[type="radio"] { border-radius: 50%; }
input[type="checkbox"]:checked, input[type="radio"]:checked { background: var(--ink); border-color: var(--ink); box-shadow: inset 0 0 0 3px var(--page); }
input[type="checkbox"].switch { width: 28px; border-radius: 8px; background: var(--panel) radial-gradient(circle at 8px 50%, var(--ink-3) 0 5px, transparent 5.5px); box-shadow: none; }
input[type="checkbox"].switch:checked { background: var(--ink) radial-gradient(circle at 19px 50%, var(--page) 0 5px, transparent 5.5px); box-shadow: none; }
.check { display: inline-flex; align-items: center; gap: var(--s2); margin: 0; min-height: var(--control-h); font: 400 14px/21px var(--sans); letter-spacing: 0.02em; text-transform: none; color: var(--ink); cursor: pointer; }

/* Settings row: a ledger row with the label and one line of detail left, one control right.
   It stays a row on a phone. */
.ledger.settings li { flex-direction: row; align-items: center; }
.ledger.settings li > :last-child { flex: none; text-align: right; font-family: var(--sans); }
.ledger.settings small { display: block; font: 400 13px/18px var(--sans); color: var(--ink-3); }

/* Form: label above, control, then one line of hint or error. Actions close the form. */
.form { display: grid; gap: var(--s4); max-width: 440px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label { margin: 0; }
.field > .hint, .field > .error { font: 400 13px/18px var(--sans); color: var(--ink-3); }
.field > .error { color: var(--negative); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
.actions.end { justify-content: flex-end; }

/* Panel: a flat fill with a 12px radius. No edge, no shadow. */
.panel { background: var(--panel); border-radius: var(--r-panel); padding: var(--s4); min-width: 0; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s2); }
.panel .figure { font-size: 22px; margin-top: 6px; }

/* Wide action: a full-width panel row, label left, arrow right. */
.wide {
  display: flex; justify-content: space-between; align-items: center; padding: var(--s2) var(--s3);
  background: var(--panel); border: 0; border-radius: var(--r-control); color: var(--ink-2);
  font: 400 14px/21px var(--sans); letter-spacing: 0.02em; transition: color var(--fast);
}
.wide::after { content: "→"; color: var(--ink-3); }
.wide:hover { color: var(--ink); }

/* Colour utilities last, so they win. */
.accent { color: var(--accent); }
.positive { color: var(--positive); }
.warning { color: var(--warning); }
.negative { color: var(--negative); }
.info { color: var(--info); }

@media (max-width: 640px) {
  :root { --gutter: 16px; }
  input, select, textarea { font-size: 16px; }
  main { padding-top: 28px; }
  .ledger li { flex-direction: column; gap: var(--s1); }
  .ledger li > :last-child { text-align: left; }
  .ledger.settings li { flex-direction: row; gap: var(--s4); }
  .ledger.settings li > :last-child { text-align: right; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } button[aria-busy="true"]::before { animation-duration: 2s; } }

/* Print and PDF: always light, A4, mono page numbers. The running header text is set per
   document in template.html, because it has to be a literal string. */
@media print {
  @page {
    size: A4; margin: 20mm;

  }
  :root:not(.keep-theme), :root[data-theme="dark"]:not(.keep-theme) {

    --rule: var(--grey-150);
    --rule-strong: var(--grey-300);
    --accent: var(--violet-300);

    --warning: var(--amber-700);
    --negative: var(--red-300);
    --info: var(--blue-400);
    --accent-soft: color-mix(in oklab, var(--accent) 12%, var(--page));
    --positive-soft: color-mix(in oklab, var(--positive) 12%, var(--page));
    --warning-soft: color-mix(in oklab, var(--warning) 14%, var(--page));
    --negative-soft: color-mix(in oklab, var(--negative) 12%, var(--page));
    --info-soft: color-mix(in oklab, var(--info) 12%, var(--page));
    --series-1: var(--violet-300);
    --series-2: var(--orange-400);
    --series-3: var(--pink-400);
    --series-4: var(--sky-500);
    --series-5: var(--green-500);
    --series-6: var(--yellow-500);
    --series-7: var(--purple-300);
    --series-8: var(--red-300);
    --btn-top: oklch(0.975 0 0);
    --btn-mid: oklch(0.95 0 0);
    --btn-edge: var(--grey-200);
    --btn-fg: var(--ink);
    --btn1-top: oklch(0.42 0.011 293);
    --btn1-mid: oklch(0.293 0.011 293);
    --btn1-edge: oklch(0.22 0.011 293);
    --btn1-fg: oklch(1 0 0);
    --btn-hover: brightness(0.97);
    --thumb: oklch(1 0 0);
    --thumb-edge: transparent;
    --thumb-shadow: 0 1px 2px oklch(0.25 0.02 278 / 0.18), 0 0 0 0.5px oklch(0.25 0.02 278 / 0.12);
    color-scheme: light;
  }
  body { font-size: 10.5pt; }
  main { max-width: none; padding: 0; }
  h2, h3 { break-after: avoid; }
  tr, li, figure, .metrics { break-inside: avoid; }
  a { border: 0; }
  button, nav, .no-print { display: none; }
}

@page { @top-left { content: "CHARTS AND DIAGRAMS"; font: 8pt "Geist Mono", monospace; letter-spacing: 0.04em; color: oklch(0.557 0.008 286); } }
svg text { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; fill: var(--ink); }
svg .s { stroke: var(--ink); stroke-width: 1; fill: none; }
svg .s.a { stroke: var(--accent); }

svg .dim { fill: var(--ink-3); }

@media (max-width: 800px) { .duo { grid-template-columns: 1fr; } }

</style>

<script>/* canzano viz. Dependency-free SVG charts and diagrams in the house style.
   Colours and type come from tokens.css through CSS variables, so both themes work.
   Use: put a JSON spec in a script tag of type application/json inside <figure class="chart" data-cz>,
   or call cz.chart(el, spec), cz.diagram(el, spec), cz.spark(el, values).
   Specs are documented in references/charts.md and references/diagrams.md. */
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = e => (typeof e === 'string' ? document.querySelector(e) : e);
  const px = v => Math.round(v) + 0.5;
  const up = s => String(s).toUpperCase();
  function el(tag, attrs, parent, txt) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    if (txt != null) n.textContent = txt;
    if (parent) parent.appendChild(n);
    return n;

    for (let i = 1; i < P.length; i++) if (P[i][1] === P[i - 1][1]) { const len = Math.abs(P[i][0] - P[i - 1][0]); if (!best || len > best.len) best = { len, x: (P[i][0] + P[i - 1][0]) / 2, y: P[i][1] }; }
    if (best && best.len >= tw(e.label, f) - 8) text(g, best.x, best.y - 7, up(e.label), (e.accent ? 'at' : 'dim') + ' halo', 'middle');
    else { const i = P.length > 2 ? 1 : 0; text(g, P[i][0] + 8, (P[i][1] + P[i + 1][1]) / 2 + f * 0.36, up(e.label), (e.accent ? 'at' : 'dim') + ' halo'); }
  }

  D.flow = function (host, s) {
    const f = fsize(host), c = Object.assign({ w: 140, h: 56, gy: 52 }, s.cell || {}), N = {}; let mc = 0, mr = 0, lane = 0, notes = 0;
    if (!c.gx) c.gx = Math.max(72, ...(s.edges || []).map(e => tw(e.label || '', f) + 28));
    c.w = Math.max(c.w, ...s.nodes.map(n => Math.max(...String(n.label).split('\n').map(l => tw(l, f))) + (n.kind === 'store' ? 52 : 24)));
    s.nodes.forEach(n => { n.col = n.col || 0; n.row = n.row || 0; N[n.id] = n; mc = Math.max(mc, n.col); mr = Math.max(mr, n.row); });
    const pad = s.groups ? 28 : 1, X = col => pad + col * (c.w + c.gx), Y = row => pad + row * (c.h + c.gy);
    (s.edges || []).forEach(e => { const a = N[e.from], b = N[e.to]; if (a.row === b.row && b.col < a.col && a.row === mr) lane = 26; });
    s.nodes.forEach(n => { if (n.note && n.row === mr) notes = f + 12; });
    const W = X(mc) + c.w + pad, H = Y(mr) + c.h + Math.max(lane, notes, s.groups ? 28 : 1) + 1, g = root(host, W, H, s.label, !s.fit);
    (s.groups || []).forEach(gr => {
      const ns = gr.nodes.map(id => N[id]), x0 = Math.min(...ns.map(n => X(n.col))) - 18, y0 = Math.min(...ns.map(n => Y(n.row))) - 18;
      const x1 = Math.max(...ns.map(n => X(n.col))) + c.w + 18, y1 = Math.max(...ns.map(n => Y(n.row))) + c.h + 18, k = 12, a = px(x0), b = px(y0), d = px(x1), e = px(y1);
      el('path', { class: 'ln', d: `M${a} ${b + k} V${b} H${a + k} M${d - k} ${b} H${d} V${b + k} M${a} ${e - k} V${e} H${a + k} M${d - k} ${e} H${d} V${e - k}` }, g);
      text(g, (x0 + x1) / 2, y0 + f * 0.36, '[ ' + up(gr.label) + ' ]', null, 'middle');
    });
    (s.edges || []).forEach(e => {
      const a = N[e.from], b = N[e.to], ax = X(a.col), ay = Y(a.row), bx = X(b.col), by = Y(b.row), acy = ay + c.h / 2, bcy = by + c.h / 2, acx = ax + c.w / 2, bcx = bx + c.w / 2; let p;
      if (a.row === b.row && b.col > a.col) p = [[ax + c.w, acy], [bx, bcy]];
      else if (a.col === b.col) p = b.row > a.row ? [[acx, ay + c.h], [bcx, by]] : [[acx, ay], [bcx, by + c.h]];
      else if (b.col > a.col) { const mx = bx - c.gx / 2; p = [[ax + c.w, acy], [mx, acy], [mx, bcy], [bx, bcy]]; }
      else if (a.row === b.row) { const ly = ay + c.h + 22; p = [[acx, ay + c.h], [acx, ly], [bcx, ly], [bcx, by + c.h]]; }
      else { const mx = ax - c.gx / 2; p = [[ax, acy], [mx, acy], [mx, bcy], [bx + c.w, bcy]]; }
      wire(g, p, e, f);
    });
    s.nodes.forEach(n => {
      box(g, X(n.col), Y(n.row), c.w, c.h, n.kind === 'store' ? '[ ' + n.label + ' ]' : n.label, f, n.accent);
      if (n.note) text(g, X(n.col) + c.w / 2, Y(n.row) + c.h + f + 8, up(n.note), 'dim', 'middle');
    });
  };

  D.sequence = function (host, s) {
    const f = fsize(host), bw = 124, bh = 40, step = s.step || 38;
    const col = Math.max(170, ...s.messages.map(m => tw(m.label || '', f) + 44)), ix = {}, X = i => 1 + bw / 2 + i * col;
    s.actors.forEach((a, i) => ix[a.id] = i);
    const selfW = Math.max(0, ...s.messages.filter(m => m.from === m.to && ix[m.from] === s.actors.length - 1).map(m => 40 + tw(m.label || '', f)));
    const W = X(s.actors.length - 1) + Math.max(bw / 2, selfW) + 2, H = bh + step * (s.messages.length + 1) + 2, g = root(host, W, H, s.label, !s.fit);
    s.actors.forEach((a, i) => { el('path', { class: 'grid strong', d: `M${px(X(i))} ${bh} V${H - 1}` }, g); box(g, X(i) - bw / 2, 0, bw, bh, a.label, f, a.accent); });
    s.messages.forEach((m, k) => {
      const y = bh + step * (k + 1), a = X(ix[m.from]), b = X(ix[m.to]), e = { accent: m.accent, dashed: m.reply };
      if (a === b) { wire(g, [[a, y - 8], [a + 28, y - 8], [a + 28, y + 8], [a, y + 8]], e, f); if (m.label) text(g, a + 36, y + f * 0.36, up(m.label), m.accent ? 'at' : 'dim'); }
      else { wire(g, [[a, y], [b, y]], e, f); if (m.label) text(g, (a + b) / 2, y - 7, up(m.label), (m.accent ? 'at' : 'dim') + ' halo', 'middle'); }
    });
  };

  D.layers = function (host, s) {
    const f = fsize(host), W = s.width || Math.max(480, host.clientWidth || 720), lw = Math.max(...s.layers.map(l => tw(l.label, f))) + 24, rh = s.rowHeight || Math.max(68, Math.min(120, room(host) / s.layers.length || 0)), bh = Math.min(64, rh - 28), gap = 12;
    const H = rh * s.layers.length + 1, g = root(host, W, H, s.label, !s.fit);
    s.layers.forEach((l, i) => {
      const y = i * rh; el('path', { class: 'grid', d: `M0 ${px(y)} H${W}` }, g);
      text(g, 0, y + rh / 2 + f * 0.36, up(l.label));
      const n = l.items.length, w = (W - lw - gap * (n - 1) - 1) / n;
      l.items.forEach((it, j) => { const o = typeof it === 'string' ? { label: it } : it; box(g, lw + j * (w + gap), y + (rh - bh) / 2, w, bh, o.label, f, o.accent); });
    });
    el('path', { class: 'grid', d: `M0 ${px(H - 1)} H${W}` }, g);
  };

  D.timeline = function (host, s) {                    // columns: [labels]; rows: [{label, from, to, accent} | {label, at, accent}]
    const f = fsize(host), W = s.width || Math.max(480, host.clientWidth || 720), lw = Math.max(...s.rows.map(r => tw(r.label, f))) + 20, top = f + 12, rh = s.rowHeight || Math.max(34, Math.min(96, (room(host) - top) / s.rows.length || 0));
    const H = top + rh * s.rows.length + 1, g = root(host, W, H, s.label, !s.fit), cw = (W - lw - 1) / s.columns.length, X = v => lw + v * cw;
    s.columns.forEach((c, i) => { el('path', { class: 'grid', d: `M${px(X(i))} ${top} V${H}` }, g); text(g, X(i) + 6, f, up(c), 'dim'); });
    el('path', { class: 'grid', d: `M${px(X(s.columns.length))} ${top} V${H}` }, g);
    if (s.now != null) { el('path', { class: 'ln a', d: `M${px(X(s.now))} ${top - 4} V${H}` }, g); text(g, X(s.now) + 6, top + f, up(s.nowLabel || 'now'), 'at'); }
    s.rows.forEach((r, i) => {
      const y = top + i * rh, cy = y + rh / 2, c = r.accent ? 'var(--accent)' : 'var(--ink-3)';
      el('path', { class: 'grid', d: `M0 ${px(y)} H${W}` }, g);
      text(g, 0, cy + f * 0.36, up(r.label), r.accent ? 'ink' : null);
      const note = (x0, x1) => { if (!r.note) return; const fits = x1 + 10 + tw(r.note, f) <= W; text(g, fits ? x1 + 10 : x0 - 10, cy + f * 0.36, up(r.note), (r.accent ? 'at' : 'dim') + ' halo', fits ? null : 'end'); };
      if (r.at != null) { el('rect', { x: X(r.at) - 4, y: cy - 4, width: 8, height: 8, style: `fill:${c}` }, g); note(X(r.at) - 4, X(r.at) + 4); }
      else { el('rect', { x: X(r.from), y: cy - 6, width: Math.max(2, X(r.to) - X(r.from)), height: 12, style: `fill:${c}` }, g); note(X(r.from), X(r.to)); }
    });
    el('path', { class: 'grid', d: `M0 ${px(H - 1)} H${W}` }, g);
  };

  D.quadrant = function (host, s) {                    // x: [low, high], y: [low, high], items: [{label, x, y, accent}] in 0..1
    const f = fsize(host), S = s.size || 420, m = f + 14, room = Math.max(40, ...s.items.filter(i => i.x > 0.6).map(i => tw(i.label, f) + 12 - (1 - i.x) * S));
    const W = m + S + room, H = S + m + 2, g = root(host, W, H, s.label, true), x0 = m, y0 = 1;
    el('path', { class: 'axis', d: `M${px(x0 + S / 2)} ${y0} V${y0 + S} M${x0} ${px(y0 + S / 2)} H${x0 + S}` }, g);
    el('rect', { class: 'grid', x: px(x0), y: px(y0), width: S, height: S }, g);
    text(g, x0, H - 3, up(s.x[0]) + ' \u2192', 'dim'); text(g, x0 + S, H - 3, up(s.x[1]), 'dim', 'end');
    el('text', { class: 'dim', transform: `translate(${f} ${y0 + S}) rotate(-90)` }, g, up(s.y[0]) + ' \u2192');
    el('text', { class: 'dim', 'text-anchor': 'end', transform: `translate(${f} ${y0}) rotate(-90)` }, g, up(s.y[1]));
    (s.corners || []).forEach((c, i) => c && text(g, x0 + (i % 2 ? S - 8 : 8), y0 + (i < 2 ? f + 6 : S - 8), up(c), 'dim', i % 2 ? 'end' : 'start'));
    s.items.forEach(it => {
      const x = x0 + it.x * S, y = y0 + (1 - it.y) * S;
      el('rect', { x: x - 3.5, y: y - 3.5, width: 7, height: 7, style: `fill:${it.accent ? 'var(--accent)' : 'var(--ink)'}` }, g);
      text(g, x + 9, y + f * 0.36, up(it.label), (it.accent ? 'at' : 'ink') + ' halo');
    });
  };

  D.tree = function (host, s) {
    const f = fsize(host), h = 40, gy = s.gapY || 44, gx = 20, all = [];
    (function walk(n, d) { n.d = d; all.push(n); (n.children || []).forEach(c => walk(c, d + 1)); })(s.root, 0);
    const w = s.nodeWidth || Math.max(96, ...all.map(n => tw(n.label, f) + 24)); let next = 0, depth = 0;
    (function place(n) { depth = Math.max(depth, n.d); if (!n.children || !n.children.length) { n.x = next; next += w + gx; } else { n.children.forEach(place); n.x = (n.children[0].x + n.children[n.children.length - 1].x) / 2; } })(s.root);
    const W = next - gx + 2, H = (depth + 1) * h + depth * gy + 2, g = root(host, W, H, s.label, !s.fit), Y = d => 1 + d * (h + gy);
    all.forEach(n => {
      if (n.children && n.children.length) {
        const cx = px(n.x + w / 2), my = px(Y(n.d) + h + gy / 2), a = px(n.children[0].x + w / 2), b = px(n.children[n.children.length - 1].x + w / 2);
        el('path', { class: 'ln', d: `M${cx} ${Y(n.d) + h} V${my} M${a} ${my} H${b} ` + n.children.map(c => `M${px(c.x + w / 2)} ${my} V${Y(c.d)}`).join(' ') }, g);
      }
      box(g, n.x, Y(n.d), w, h, n.label, f, n.accent);
    });
  };

  function diagram(host, spec) { host = $(host); D[spec.type](host, JSON.parse(JSON.stringify(spec))); }

  function auto(scope) {
    (scope || document).querySelectorAll('[data-cz]').forEach(host => {
      const src = host.querySelector('script[type="application/json"]'); if (!src || host.dataset.czDone) return;
      const spec = JSON.parse(src.textContent); host.dataset.czDone = '1';
      const cap = host.querySelector('figcaption'), mount = document.createElement('div');
      host.insertBefore(mount, cap);
      (D[spec.type] ? diagram : chart)(mount, spec);
    });
  }
  /* Lint: finds the layout faults that are easy to miss. Run cz.lint() in the page and fix what it lists.
     stranded: a heading or line whose last line is one short word. long-headline: more than two lines on a slide.
     overflow: content cut off by its slide or wider than the page. */
  function lint(scope) {
    const out = [], lines = n => { const r = document.createRange(); r.selectNodeContents(n); const rows = []; [...r.getClientRects()].forEach(q => { if (q.width < 1) return; const row = rows.find(x => Math.abs(x.top - q.top) < q.height / 2); if (row) { row.left = Math.min(row.left, q.left); row.right = Math.max(row.right, q.right); } else rows.push({ top: q.top, left: q.left, right: q.right }); }); return rows.sort((a, b) => a.top - b.top); };
    (scope || document).querySelectorAll('h1, h2, h3, p, li, figcaption, .lead').forEach(n => {
      if (!n.offsetParent || n.closest('svg')) return;
      const rows = lines(n), txt = n.textContent.trim().replace(/\s+/g, ' '); if (rows.length < 2) return;
      const widest = Math.max(...rows.map(r => r.right - r.left)), last = rows[rows.length - 1], lastWord = txt.split(' ').pop();
      if ((last.right - last.left) < widest * 0.2 || (rows.length <= 3 && /^H[123]$/.test(n.tagName) && (last.right - last.left) < widest * 0.34 && lastWord.length < 9)) out.push({ issue: 'stranded', text: txt.slice(0, 80) });
      if (n.closest('.slide') && !n.closest('.statement, .title') && /^H[12]$/.test(n.tagName) && rows.length > 2) out.push({ issue: 'long-headline', text: txt.slice(0, 80) });
    });
    (scope || document).querySelectorAll('.slide').forEach((sl, i) => { if (sl.scrollHeight > sl.clientHeight + 2 || sl.scrollWidth > sl.clientWidth + 2) out.push({ issue: 'overflow', text: 'slide ' + (i + 1) }); });
    if (document.documentElement.scrollWidth > document.documentElement.clientWidth + 2 && !document.querySelector('.deck')) out.push({ issue: 'overflow', text: 'page is wider than the window' });
    return out;
  }
  window.cz = { chart, diagram, spark, auto, lint };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => auto()); else auto();
})();
</script>
