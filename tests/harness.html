<!doctype html>
<meta charset="utf-8">
<title>pending</title>
<!-- Loads a page in a frame of a given width and reports its sideways overflow in the document title.
     Used by tests/check.py; Chrome needs --allow-file-access-from-files to read into the frame. -->
<body style="margin:0">
<script>
const p = new URLSearchParams(location.search), w = +p.get('w') || 1100, frame = document.createElement('iframe');
frame.style.cssText = 'border:0;display:block;width:' + w + 'px;height:' + (+p.get('h') || 900) + 'px';
frame.src = p.get('src');
frame.onload = () => { if (p.get('theme')) frame.contentDocument.documentElement.dataset.theme = p.get('theme'); setTimeout(() => {
  const de = frame.contentDocument.documentElement;
  document.title = 'RESULT ' + JSON.stringify({ overflow: Math.max(0, de.scrollWidth - de.clientWidth), slides: de.querySelectorAll('.slide').length });
}, 900); };
document.body.appendChild(frame);
</script>
