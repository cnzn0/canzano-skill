<!doctype html>
<meta charset="utf-8">
<title>pending</title>
<!-- Loads a page in a frame of a given width and reports what it finds in the document title.
     Used by tests/check.py; Chrome needs --allow-file-access-from-files to read into the frame. -->
<body style="margin:0">
<script>
const p = new URLSearchParams(location.search), w = +p.get('w') || 1100, frame = document.createElement('iframe');
frame.style.cssText = 'border:0;display:block;width:' + w + 'px;height:900px';
frame.src = p.get('src');
frame.onload = () => setTimeout(() => {
  const out = { src: p.get('src'), w };
  try {
    const win = frame.contentWindow, doc = win.document, de = doc.documentElement;
    out.lint = win.cz && win.cz.lint ? win.cz.lint() : 'cz.lint missing';
    out.asserts = win.__assert ? win.__assert() : [];
    out.overflow = doc.querySelector('.deck') ? 0 : Math.max(0, de.scrollWidth - de.clientWidth);
    out.slides = doc.querySelectorAll('.slide').length;
  } catch (e) { out.error = String(e); }
  document.title = 'RESULT ' + JSON.stringify(out);
}, 900);
document.body.appendChild(frame);
</script>
